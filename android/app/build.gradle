plugins { id 'com.android.application' }
android {
    namespace 'com.arenazumbi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.arenazumbi.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4'
    }
    signingConfigs {
        release {                                // chave secreta: vem dos segredos do GitHub (ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS), nunca do repositório
            storeFile file(System.getenv('ANDROID_KEYSTORE') ?: 'release.keystore')
            storeType 'pkcs12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASS')
            keyAlias 'arena'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASS')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html' }
    lint { checkReleaseBuilds false; abortOnError false }
}
