plugins { id 'com.android.application' }
android {
    namespace 'com.arenazumbi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.arenazumbi.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.1'
    }
    signingConfigs {
        fixo {                                   // chave fixa: o APK novo instala por cima do antigo
            storeFile file('../arena.keystore'); storePassword 'arenazumbi'; keyAlias 'arena'; keyPassword 'arenazumbi'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.fixo } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html' }
}
