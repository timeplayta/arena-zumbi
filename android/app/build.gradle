plugins { id 'com.android.application' }
android {
    namespace 'com.arenazumbi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.arenazumbi.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html' }
}
