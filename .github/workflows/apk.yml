name: APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Copiar APK
        run: mkdir -p apk && cp android/app/build/outputs/apk/debug/app-debug.apk apk/Arena-Zumbi.apk
      - uses: actions/upload-artifact@v4
        with: { name: Arena-Zumbi-APK, path: apk/Arena-Zumbi.apk }
      - name: Salvar APK no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apk/Arena-Zumbi.apk
          git commit -m "APK gerado automaticamente" || exit 0
          git pull --rebase && git push
