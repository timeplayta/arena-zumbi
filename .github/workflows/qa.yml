name: QA
on:
  push:
    branches: [qa]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node qa.js game.html out ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa_${{ matrix.profile }}
          path: out
