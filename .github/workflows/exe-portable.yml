# Gera "Arena-Zumbi-Portatil.exe": um único arquivo que se extrai sozinho e abre o jogo (não precisa da pasta).
# Roda à mão ou depois que o exe do zip é assinado. O jogo se atualiza sozinho ao abrir. Salva em windows/Arena-Zumbi-Portatil.exe.
name: Exe portatil
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Assinar exe"]
    types: [completed]
permissions:
  contents: write
concurrency: { group: exe-portatil, cancel-in-progress: true }
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Extrair a pasta do jogo
        shell: pwsh
        run: Expand-Archive windows/Arena-Zumbi-Windows.zip -DestinationPath out
      - name: Montar o exe portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $ico = (Resolve-Path windows/icon.ico).Path -replace '\\','/'
          $cfg = @{ name = "arena-zumbi"; version = "1.3.0"; build = @{ appId = "com.arenazumbi.game"; productName = "Arena Zumbi"; electronVersion = "33.2.0"; win = @{ target = "portable"; icon = $ico }; portable = @{ artifactName = "Arena-Zumbi-Portatil.exe"; unpackDirName = "ArenaZumbi" }; directories = @{ output = "dist" } } }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content build/package.json -Encoding utf8
          cd build
          npm i --no-save electron-builder@25.1.8
          npx electron-builder --win portable --prepackaged "../out/Arena Zumbi" --publish never
      - name: Assinar o exe portatil
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_PFX_B64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { Write-Host "sem certificado: segue sem assinar"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Arena Zumbi" build/dist/Arena-Zumbi-Portatil.exe
          $code = $LASTEXITCODE; Remove-Item $pfx -Force; if ($code -ne 0) { exit $code }
          $s = Get-AuthenticodeSignature build/dist/Arena-Zumbi-Portatil.exe
          Write-Host "Assinatura: $($s.Status) - $($s.SignerCertificate.Subject)"
      - name: Salvar no repositório
        shell: pwsh
        run: |
          Copy-Item build/dist/Arena-Zumbi-Portatil.exe windows/Arena-Zumbi-Portatil.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add windows/Arena-Zumbi-Portatil.exe
          git commit -m "Exe portatil gerado automaticamente"
          git pull --rebase; git push
      - uses: actions/upload-artifact@v4
        with:
          name: exe-portatil
          path: build/dist/Arena-Zumbi-Portatil.exe
