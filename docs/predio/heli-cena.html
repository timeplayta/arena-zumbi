<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>

<script>

  const c = document.createElement("canvas"); c.width = 16; c.height = 512; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 512);

  g.fillStyle = gr; g.fillRect(0, 0, 16, 512); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

S.add(sky);
S.fog = new THREE.FogExp2(0x2c2433, 0.009);

// laje de concreto com manchas e poças
function concrete() {
  const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d");
  g.fillStyle = "#6d6a66"; g.fillRect(0, 0, 1024, 1024); let sd = 9; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 4000; i++) { const v = 80 + r() * 60 | 0; g.fillStyle = `rgba(${v},${v - 3},${v - 6},0.25)`; g.fillRect(r() * 1024, r() * 1024, 2 + r() * 5, 2 + r() * 5); }
  for (let i = 0; i < 40; i++) { const x = r() * 1024, y = r() * 1024, s = 30 + r() * 120; const rg = g.createRadialGradient(x, y, 0, x, y, s); rg.addColorStop(0, "rgba(30,28,26,0.35)"); rg.addColorStop(1, "rgba(30,28,26,0)"); g.fillStyle = rg; g.fillRect(x - s, y - s, s * 2, s * 2); }
  g.strokeStyle = "rgba(40,38,36,0.6)"; g.lineWidth = 3; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, 1024); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(1024, i * 128); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
function puddles() { const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d"); g.fillStyle = "#e0e0e0"; g.fillRect(0, 0, 1024, 1024);
  let sd = 13; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647; g.filter = "blur(10px)";
  for (let i = 0; i < 26; i++) { g.fillStyle = "#151515"; g.beginPath(); g.ellipse(r() * 1024, r() * 1024, 30 + r() * 110, 18 + r() * 60, r() * 3, 0, 6.3); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t; }
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: concrete(), roughness: 1, roughnessMap: puddles(), metalness: 0.15, envMapIntensity: 1.4 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; S.add(floor);

  g.fillStyle = "rgba(240,236,226,0.88)"; g.fillRect(330, 250, 90, 524); g.fillRect(604, 250, 90, 524); g.fillRect(420, 466, 184, 92);
  let sd = 3; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  g.globalCompositeOperation = "destination-out"; for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${0.2 + r() * 0.5})`; g.beginPath(); g.arc(r() * 1024, r() * 1024, 2 + r() * 10, 0, 6.3); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const padM = new THREE.Mesh(new THREE.PlaneGeometry(13, 13), new THREE.MeshStandardMaterial({ map: pad(), transparent: true, roughness: 0.7, polygonOffset: true, polygonOffsetFactor: -2 }));
padM.rotation.x = -Math.PI / 2; padM.position.y = 0.01; padM.receiveShadow = true; S.add(padM);
// luzes do heliponto
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const l = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.08, 10), new THREE.MeshStandardMaterial({ color: 0xffc35a, emissive: 0xffa630, emissiveIntensity: 1.1 })); l.position.set(Math.cos(a) * 6.9, 0.04, Math.sin(a) * 6.9); S.add(l); }

const hut = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 4), hutM); hut.position.set(-10, 1.5, 9); hut.castShadow = hut.receiveShadow = true; S.add(hut);
const door = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.2), new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xffb060, emissiveIntensity: 1.6 })); door.position.set(-10, 1.1, 6.99); door.rotation.y = Math.PI; S.add(door);
const dl = new THREE.PointLight(0xffb060, 1.4, 8, 2); dl.position.set(-10, 1.8, 6.4); S.add(dl);
// caixas d'água, ar-condicionado
for (const [x, z] of [[11, 10], [12.5, 7.5]]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2.2, 20), new THREE.MeshStandardMaterial({ color: 0x3f5a6a, roughness: 0.6, metalness: 0.3 })); t.position.set(x, 1.1, z); t.castShadow = true; S.add(t); }
for (const [x, z] of [[-12, -10], [-9.5, -11.5], [12, -11]]) { const a = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1, 1.4), new THREE.MeshStandardMaterial({ color: 0xb5b2ac, roughness: 0.5, metalness: 0.4 })); a.position.set(x, 0.5, z); a.castShadow = true; S.add(a); }
// cidade ao fundo: prédios escuros com janelas acesas
function winTex(seed) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 256; const g = c.getContext("2d"); g.fillStyle = "#14141a"; g.fillRect(0, 0, 128, 256);
  let sd = seed; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let y = 6; y < 256; y += 12) for (let x = 6; x < 128; x += 12) if (r() < 0.18) { g.fillStyle = r() < 0.7 ? "#ffcf8a" : "#9fd0ff"; g.fillRect(x, y, 6, 7); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
let sd = 21; const rr = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 90; i++) {
  const a = rr() * Math.PI * 2, d = 70 + rr() * 150, h = 8 + rr() * 45, w = 6 + rr() * 14;
  const tx = winTex(i * 31 + 7); tx.repeat.set(w / 12, h / 24); tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshStandardMaterial({ color: 0x111015, emissiveMap: tx, emissive: 0xffffff, emissiveIntensity: 0.7, roughness: 0.9 }));
  b.position.set(Math.cos(a) * d, h / 2 - 30, Math.sin(a) * d); S.add(b);
}
// fumaça ao longe (sprites)
function smokeTex() { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"); const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, "rgba(60,50,55,0.55)"); rg.addColorStop(1, "rgba(60,50,55,0)"); g.fillStyle = rg; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); }
const st = smokeTex();
for (let i = 0; i < 40; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: st, transparent: true, depthWrite: false })); const a = 2.2 + rr() * 0.8; s.position.set(Math.cos(a) * 110 + rr() * 10, -10 + i * 1.8, Math.sin(a) * 110); s.scale.setScalar(14 + i * 0.9); S.add(s); }
// letreiros de neon e cabos
function neon(txt, col, x, y, z, ry, sz) { const c = document.createElement("canvas"); c.width = 512; c.height = 128; const g = c.getContext("2d");
  g.font = "700 86px 'Arial Narrow', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.shadowColor = col; g.shadowBlur = 24; g.fillStyle = col; g.fillText(txt, 256, 66); g.fillText(txt, 256, 66);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; const m = new THREE.Mesh(new THREE.PlaneGeometry(sz * 4, sz), new THREE.MeshBasicMaterial({ map: t, transparent: true, fog: false, depthWrite: false })); m.position.set(x, y, z); m.rotation.y = ry; S.add(m);
  const l = new THREE.PointLight(col, 2.5, 30, 2); l.position.set(x, y - 2, z); S.add(l); }
neon("HOTEL", "#ff3d6e", -24, 9, -26, 0.75, 4); neon("FARMÁCIA", "#38f0c8", 30, 4, -20, -0.9, 3.2); neon("24H", "#ffb34a", 26, 7, 24, -2.3, 2.6);
const cab = new THREE.LineBasicMaterial({ color: 0x0b0b0d }); for (let i = 0; i < 5; i++) { const pts = []; for (let k = 0; k <= 20; k++) { const u = k / 20; pts.push(new THREE.Vector3(-15 + u * -30, 6 + i * 0.8 - Math.sin(u * Math.PI) * 3, -14 + u * -20 + i)); } S.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), cab)); }
// chuva fina
{ const n = 5000, p = new Float32Array(n * 6); for (let i = 0; i < n; i++) { const x = (rr() - 0.5) * 60, y = rr() * 30, z = (rr() - 0.5) * 60; p.set([x, y, z, x + 0.05, y - 0.55, z + 0.03], i * 6); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3)); S.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xaab4c8, transparent: true, opacity: 0.22 }))); }
// helicóptero
const heli = Helicopter.make({}); heli.group.rotation.y = -0.55; S.add(heli.group);
heli.update(0.05);
// cinematic: câmera
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 900);
const VIEWS = {
  a: [[-11, 2.4, -9.5], [0, 1.8, 0]],
  b: [[9.5, 3.2, 8.5], [0, 1.6, 0]],
  c: [[-3.2, 1.7, -7.2], [0, 1.6, -1]],
  d: [[13, 8, -6], [0, 1.2, 1]],
  e: [[-12, 1.7, 7.8], [-2, 1.6, 0]],
  f: [[-7.5, 2.2, 12.5], [0, 2.6, 0]],

window.shot = (k, spin) => { const [p, t] = VIEWS[k]; cam.position.set(...p); cam.lookAt(...t); if (spin) { heli.setSpin(spin); for (let i = 0; i < 3; i++) heli.update(0.016); } R.render(S, cam); return true; };
window.ready = true;
